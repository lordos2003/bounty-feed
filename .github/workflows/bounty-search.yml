name: bounty-search

on:
  schedule:
    - cron: "17 2 * * *"
    - cron: "17 14 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  issues: read

concurrency:
  group: bounty-search
  cancel-in-progress: false

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Search GitHub issues for bounties
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/search.py
      - name: Commit results
        run: |
          git config user.name  "bounty-feed-bot"
          git config user.email "bounty-feed-bot@users.noreply.github.com"
          git add results/
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "results: $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
